[project]
name = "odds-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odds_lab"]

[project.scripts]
odds-lab = "odds_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
